<!DOCTYPE html>
<html>
<head>
<style>
body {
    text-align: center;
    margin-top: 200px;
}

button {
    padding: 12px 28px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    margin: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="box">
    <h1>Do you love me🙄? ❤️</h1>
    <button id="yes">Yes🤩</button>
    <button id="no">No🫩</button>
</div>

<script>
let yes = document.getElementById("yes");
let no = document.getElementById("no");

yes.addEventListener("click", function() {
    document.getElementById("box").innerHTML =
        "<h1>Haaye Mera Baccha 😘😘</h1>";
});

no.addEventListener("click", function() {
    no.innerText = "Try again Bitch😂";

    no.style.position = "fixed";

    function moveNo() {
        let x = Math.random() * (window.innerWidth - no.offsetWidth);
        let y = Math.random() * (window.innerHeight - no.offsetHeight);

        no.style.left = x + "px";
        no.style.top = y + "px";
    }

    moveNo();

    setInterval(moveNo, 700);
});
</script>

</body>
</html>
